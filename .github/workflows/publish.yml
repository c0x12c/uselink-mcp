name: Publish @uselink/mcp

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match package.json version $PKG. Bump package.json before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: npm run smoke

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@uselink/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@uselink/mcp@$VERSION is already published — skipping."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
